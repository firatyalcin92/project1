# Render "Blueprint": GitHub'daki her güncellemede MESELE'yi otomatik derleyip yayınlar.
# Kurulum: https://render.com/deploy?repo=https://github.com/firatyalcin92/project1
services:
  - type: web
    name: mesele
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      # Supabase bilgileri girilince veriler kalıcı olarak Supabase'de tutulur.
      # Girilmezse bellek kullanılır (sunucu uyuyunca/yeniden başlayınca silinir).
      - key: MESELE_STORE
        value: memory
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Kurulumda Render bu değeri sorar; anahtar GitHub'a girmez.
      - key: OPENAI_API_KEY
        sync: false
      # Ödeme altyapısı bağlanana kadar: "test" → üyelik ödeme alınmadan denenebilir
      - key: MESELE_PAYMENTS
        value: test
      # Ücretsiz test sürümü: her çift 1 mesele, tüm uygulamada günde en fazla 3 yeni mesele
      - key: MESELE_BETA
        value: "1"
      - key: MESELE_DAILY_LIMIT
        value: "3"
      # Cihaz kimliği / IP hash'leri için isteğe bağlı tuz (rastgele uzun bir metin)
      - key: MESELE_HASH_SALT
        sync: false
      # /yonetim sayfasının şifresi (test sonuçları)
      - key: MESELE_ADMIN_PASSWORD
        sync: false
