<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>Reel Kapak</title><link rel="stylesheet" href="sahne.css">
<style>
html,body{background:#efe3d3}
svg{position:absolute;inset:0;transform-origin:540px 700px;transform:translateY(160px) scale(1.2)}
.box{position:absolute;left:70px;right:130px;top:220px;text-align:center}
.box .k{font:700 28px var(--sans);letter-spacing:8px;color:var(--wine);margin-bottom:22px}
.box h1{font:700 88px/1.06 var(--serif);color:var(--ink)}
.box h1 em{color:var(--wine);font-style:italic;font-weight:600}
</style></head><body>
<svg id="s" width="1080" height="1920"></svg>
<div class="box"><div class="k">AİLE &amp; ÇİFT İLİŞKİLERİ</div><h1>Kısır döngüden<br><em>nasıl</em> çıkılır?</h1></div>
<div style="position:absolute;left:0;right:60px;top:560px;text-align:center"><span style="display:inline-block;padding:16px 40px;border-radius:50px;background:#4f5a43;color:#fff;font:800 40px var(--sans);letter-spacing:6px">PART 2</span></div>
<script src="karakter.js"></script><script>
const arcs=[[-80,-10],[10,80],[100,170],[190,260]].map(([a0,a1])=>{const R=360,cx=540,cy=650,r0=a0*Math.PI/180,r1=a1*Math.PI/180;
 const x1=cx+R*Math.cos(r1),y1=cy+R*Math.sin(r1),tx=-Math.sin(r1),ty=Math.cos(r1);
 return `<path d="M${cx+R*Math.cos(r0)} ${cy+R*Math.sin(r0)} A${R} ${R} 0 0 1 ${x1} ${y1}" fill="none" stroke="#7f8c70" stroke-width="10" stroke-linecap="round" opacity=".55"/>
 <path d="M${x1-tx*30+ty*16} ${y1-ty*30-tx*16} L${x1} ${y1} L${x1-tx*30-ty*16} ${y1-ty*30+tx*16}" fill="none" stroke="#7f8c70" stroke-width="10" stroke-linecap="round" opacity=".55"/>`}).join('');
document.getElementById('s').innerHTML = room({t:0, noframe:1,
  w:{kind:'w',x:380,arms:'mug',look:[1,0],tilt:5,mood:'h'},
  m:{kind:'m',x:700,arms:'mug',look:[-1,0],tilt:-5,mood:'h'}}).replace('<rect x="130" y="690"', arcs + '<rect x="130" y="690"');
</script></body></html>
