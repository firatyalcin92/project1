<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Kapak — Çocuğunuz Yerinde Durmuyor</title>
<style>
  @font-face { font-family: RD; font-weight: 800; src: url('file:///usr/share/fonts/opentype/inter/InterDisplay-ExtraBold.otf'); }
  @font-face { font-family: RD; font-weight: 900; src: url('file:///usr/share/fonts/opentype/inter/InterDisplay-Black.otf'); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1080px; height: 1920px; overflow: hidden; font-family: RD, 'Noto Color Emoji', sans-serif; }
  .cover { position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: radial-gradient(560px 480px at 12% 22%, rgba(255,94,108,0.35), transparent 70%),
                radial-gradient(640px 520px at 92% 58%, rgba(167,139,250,0.35), transparent 70%),
                radial-gradient(700px 500px at 50% 100%, rgba(255,201,60,0.18), transparent 70%),
                linear-gradient(#0A0F27, #16163F 55%, #231A4E); }
  .halo { position: absolute; left: 540px; top: 1250px; width: 1300px; height: 1300px; transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255,214,150,0.40), rgba(255,214,150,0) 60%); }
  .necla { position: absolute; left: 50%; bottom: -10px; height: 1280px; transform: translateX(-50%);
    filter: drop-shadow(0 0 40px rgba(255,220,170,0.45)) saturate(0.96) contrast(1.04); }
  .tag { position: absolute; top: 150px; left: 50%; transform: translateX(-50%); padding: 12px 30px; border-radius: 40px;
    background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.18); color: #fff; font-weight: 800; font-size: 30px; letter-spacing: 2px; white-space: nowrap; }
  .call { position: absolute; top: 250px; left: 50%; transform: translateX(-50%) rotate(-2deg); background: #fff; color: #141A3A;
    font-weight: 900; font-size: 40px; padding: 14px 34px; border-radius: 50px; white-space: nowrap; box-shadow: 0 14px 30px rgba(0,0,0,0.35); }
  .title { position: absolute; top: 360px; width: 100%; text-align: center; color: #fff; font-weight: 900; text-shadow: 0 10px 30px rgba(0,0,0,0.45); }
  .l1 { font-size: 112px; line-height: 1.02; letter-spacing: -2px; }
  .l2 { font-size: 118px; line-height: 1.02; color: #FFC93C; letter-spacing: -2px; white-space: nowrap; }
  .zap { position: absolute; font-size: 90px; filter: drop-shadow(0 10px 18px rgba(0,0,0,0.4)); }
  .name { position: absolute; left: 60px; top: 1500px; background: rgba(12,16,40,0.88); border-radius: 26px; padding: 26px 40px 26px 46px; box-shadow: 0 16px 40px rgba(0,0,0,0.4); }
  .name::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 14px; border-radius: 26px 0 0 26px; background: #FFC93C; }
  .name .n1 { color: #fff; font-weight: 900; font-size: 52px; white-space: nowrap; }
  .name .n1 span { color: #FFC93C; font-weight: 800; font-size: 34px; margin-right: 12px; }
  .name .n2 { color: rgba(255,255,255,0.85); font-weight: 800; font-size: 30px; margin-top: 6px; white-space: nowrap; }
</style>
</head>
<body>
<div class="cover">
  <div class="halo"></div>
  <img class="necla" src="necla.png" alt="">
  <div class="tag">💡 EBEVEYN İPUCU</div>
  <div class="call">📞 Okuldan aranıyor musunuz?</div>
  <div class="title">
    <div class="l1">ÇOCUĞUNUZ</div>
    <div class="l2">YERİNDE</div>
    <div class="l2">DURMUYOR MU?</div>
  </div>
  <div class="zap" style="top:820px; left:70px; transform:rotate(-14deg)">⚡</div>
  <div class="zap" style="top:860px; right:70px; transform:rotate(12deg)">🌀</div>
  <div class="name">
    <div class="n1"><span>Pedagog</span>Necla SAYGIN</div>
    <div class="n2">Çocuk Psikolojisi &amp; Dikkat Üzerine</div>
  </div>
</div>
</body>
</html>
