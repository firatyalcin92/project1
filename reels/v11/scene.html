<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Reels v11 — Kaygıyı artıran 12 şey (Part 2)</title>

<body>
<canvas id="c" width="1080" height="960"></canvas>
<canvas id="o" width="1080" height="960"></canvas>
<canvas id="f" width="1080" height="1920"></canvas>
<script src="../engine.js"></script>
<script src="../follow.js"></script>
<script src="../splitfull.js"></script>
<script>
// Video 11: Çocuklarda kaygıyı artıran 12 şey — Part 2 (7–12). Altyazı yok.
// Açılış 10,4 sn tam ekran konuşmacı → bölünmüş ekran; altta önceki videoların stok ve klipleri karışık,
// konuşmacı yalnızca madde girişlerinde kısa görünür; son ~20 sn konuşmacı yok.
// Tam ekranda yazılar yüzü kapatmaz: başlık kartı ve isim levhası yüzün altında (y > 1000).
const DURATION = 165.09;
const SRC = { w: 1908, h: 2862 };
const BAND = { x: 204, y: 300, w: 1500, h: 1333 };
const FULLV = { x: 223, y: 0, w: 1462, h: 2600 };   // sağ alttaki filigran (x > 1700, y > 2700) dışarıda
const AVATAR = { chain: `crop=${BAND.w}:${BAND.h}:${BAND.x}:${BAND.y},scale=1620:1440:flags=lanczos`, focusY: 0.35 };
const INTRO = { hold: 10.4, len: 1.4 };
const OUTRO = { at: 1e9, len: 1 };                    // kapanışta tam ekran yok
const FULL_RANGES = [[0, INTRO.hold + INTRO.len]];
const TOP_CLIPS = [{ name: 'avIn', src: 'avatar_src.mp4', from: 0, start: 0, end: INTRO.hold + INTRO.len + 0.2 }];
const CHUNKS = [];

// Alt bölüm: 'A' = konuşmacı; diğerleri [kaynak, başlangıç, bitiş, kaynaktaki başlangıç, dikey odak]
const S10 = '../v10/clips/stok.mp4', S9 = '../v9/clips/stok.mp4', S8 = '../v8/clips/stok.mp4';
const BLOK = '../v4/clips/bloklar.mp4', KURE = '../v4/clips/kure.mp4', OKUMA = '../v5/clips/okuma.mp4', DALGIN = '../v5/clips/dalgin.mp4';
const BOTTOM_PLAN = [
  ['A', 0, INTRO.hold + INTRO.len],
  [S9, 11.8, 15.4, 99.0, 0.3],                   // bağırmak → öfkeli kız
  [S8, 15.4, 20.4, 36.0, 0.2],                     // tepkisinden korkmak → ağlayan kız
  [S10, 20.4, 24.0, 1.0, 0.45],                    // durup sakinleşmek → kenetlenen eller
  [S10, 24.0, 27.3, 97.0, 0.3],                    // açıkça anlatın
  [BLOK, 27.3, 31.5, 3.0, 0.08],                   // oyuncaklar
  [S8, 31.5, 34.6, 0.8, 0.25],                     // sakin ve kararlı
  ['A', 34.6, 38.4],                               // 8. madde
  [S8, 38.4, 43.0, 9.0, 0.6],                      // açıklamasız yasak
  [S10, 43.0, 46.8, 39.0, 0.3],                    // kestirememek
  [OKUMA, 46.8, 51.7, 1.0, 0.25],                  // kuralları açıklayın
  [S10, 51.7, 56.0, 120.0, 0.4],                   // yaşına uygun dille
  ['A', 56.0, 59.9],                               // 9. madde
  [S8, 59.9, 64.7, 58.6, 0.2],                     // başarılı, düzenli, hatasız
  [S10, 64.7, 70.0, 51.0, 0.25],                   // tehdit olarak algılamak
  [KURE, 70.0, 77.3, 2.0, 0.3],                    // çaba, öğrendikleri
  [DALGIN, 77.3, 84.7, 14.0, 0.3],                 // en yüksek not gerekmiyor
  ['A', 84.7, 89.6],                               // 10. madde
  [DALGIN, 89.6, 94.2, 22.0, 0.3],                 // her sorunu onun yerine çözmek
  [BLOK, 94.2, 98.6, 8.0, 0.08],                   // kendi başına baş etmek
  [S10, 98.6, 105.4, 88.0, 0.35],                  // güvenli sınırlar içinde hata
  [KURE, 105.4, 112.2, 10.0, 0.3],                 // sence nasıl deneyebilirsin?
  ['A', 112.2, 116.2],                             // 11. madde
  [S10, 116.2, 120.5, 105.5, 0.4],                 // dikkat et, düşeceksin
  [S10, 120.5, 126.4, 28.5, 0.4],                  // tehlike alanı
  [S8, 126.4, 131.0, 19.0, 0.3],                   // kısa, somut uyarılar
  [S10, 131.0, 134.2, 111.0, 0.4],                 // keşfetmesine izin
  [S8, 134.2, 141.7, 26.5, 0.15],                  // riskleri tanımak
  ['A', 141.7, 145.0],                             // 12. madde
  [S9, 145.0, 151.7, 119.0, 0.3] ,                  // üzüntüsünü ifade etmek
  [S10, 151.7, 158.4, 78.0, 0.35],                 // ben buradayım
  [S10, 158.4, DURATION, 124.5, 0.4],              // birlikte konuşun
];
const BOTTOM_CLIPS = BOTTOM_PLAN.map((p, i) => {
  if (p[0] === 'A') return null;
  const prev = BOTTOM_PLAN[i - 1], next = BOTTOM_PLAN[i + 1];
  return { src: p[0], start: p[1], end: p[2], from: p[3], focusY: p[4],
    fadeIn: prev[0] === 'A', fadeOut: !!next && next[0] === 'A' };
}).filter(Boolean);

window.preload = () => preloadFollow('../');

function noRow(label, em, y, t, t0, tS, size = 42) {
  withT(540, y, popS(t, t0, 0.5), 0, popA(t, t0) * (1 - 0.45 * prog(t, tS + 0.1, 0.4)), () => pill(label, em, size, 'rgba(255,255,255,0.9)', C.ink));
  if (t >= tS) { font(size, 800); const w = ctx.measureText(label).width + size * 1.25 + 70; strike(540 - w / 2 - 20, 540 + w / 2 + 20, y, t, tS); }
}
function card(x, y, w, h, bg, t, t0, body, rot = 0) {
  withT(x, y, popS(t, t0, 0.55), rot, popA(t, t0), () => { shadow(true, 36, 14); rrect(-w / 2, -h / 2, w, h, 44, bg); shadow(false); body(); });
}

// Madde sahnesi: numara + başlık, ardından satırlar (bad: kaygı artıran söz, eff: etkisi, good: bunun yerine, tip: öneri).
// Ekranda en fazla 3 satır kalır; yenisi gelince eskisi yukarı kayarak çıkar.
const ROW = { bad: { h: 150, bg: C.coral, fg: C.white, em: '❌' }, good: { h: 160, bg: C.mint, fg: C.ink, em: '✅' },
  eff: { h: 104, bg: 'rgba(255,255,255,0.12)', fg: C.white, em: '⚠️' }, tip: { h: 104, bg: C.yellow, fg: C.ink, em: '💡' } };
function item(t, d) {
  withT(540, 236, popS(t, d.t0, 0.5), 0, popA(t, d.t0), () => {
    rrect(-80, -30, 160, 60, 30, C.coral); text(`${d.n} / 12`, 0, 2, 32, C.white, 900);
  });
  para(d.title, 540, 322, 960, t, d.t0 + 0.1, { size: 52, weight: 900, per: 0.1 });
  const shown = d.rows.filter(r => t >= r.t0);
  const win = shown.slice(-3);
  let y = 430;
  d.rows.forEach(r => {
    const idx = win.indexOf(r);
    const gone = t >= r.t0 && idx < 0;
    if (t < r.t0 || gone && prog(t, d.rows[d.rows.indexOf(r) + 3].t0, 0.4) >= 1) return;
    const st = ROW[r.k];
    let a = popA(t, r.t0, 0.25), yy;
    if (gone) {
      const p = eInOut(prog(t, d.rows[d.rows.indexOf(r) + 3].t0, 0.4));
      a *= 1 - p; yy = 430 + st.h / 2 - 80 * p;
    } else {
      // pencere içindeki yerine yumuşakça kay
      let base = 430; for (let k = 0; k < idx; k++) base += ROW[win[k].k].h + 22;
      const lastT = win[win.length - 1].t0;
      const shift = d.rows.indexOf(win[0]) > 0 ? (1 - eInOut(prog(t, lastT, 0.4))) * (ROW[d.rows[d.rows.indexOf(win[0]) - 1].k].h + 22) : 0;
      yy = base + shift + st.h / 2;
    }
    withT(540, yy, 0.9 + 0.1 * eBack(prog(t, r.t0, 0.4)), 0, a, () => {
      shadow(true, 26, 10); rrect(-470, -st.h / 2, 940, st.h, 34, st.bg); shadow(false);
      emoji(st.em, -415, 0, r.k === 'bad' || r.k === 'good' ? 54 : 44);
      para(r.text, 40, 2, 800, t, r.t0, { size: r.k === 'bad' || r.k === 'good' ? 36 : 34, weight: 900, color: st.fg, accent: r.k === 'good' ? C.white : C.yellow, per: 0.05, lineH: 44 });
    });
  });
}

const ITEMS = [
  { n: 7, title: '*Bağırmak', t0: 10.3, rows: [
    { k: 'bad', text: 'Sık tekrarlanan bağırmalar 📢', t0: 12.4 },
    { k: 'eff', text: 'Hata yapmaktan ve tepkinizden korkar', t0: 15.3 },
    { k: 'tip', text: 'Önce durun, sakinleşin, sonra açıkça anlatın', t0: 20.5 },
    { k: 'good', text: '“Oyuncakları fırlatmana izin veremem, onları yere bırakmanı istiyorum.”', t0: 27.3 } ] },
  { n: 8, title: 'Belirsiz *kurallar koymak', t0: 35.0, rows: [
    { k: 'bad', text: 'Bugün serbest, yarın açıklamasız yasak', t0: 38.5 },
    { k: 'eff', text: 'Neyle karşılaşacağını kestiremez', t0: 43.0 },
    { k: 'good', text: 'Kuralları önceden açıklayın, tutarlı uygulayın', t0: 46.8 },
    { k: 'tip', text: 'Kural değişirse nedenini anlatın 🗣️', t0: 51.8 } ] },
  { n: 9, title: '*Mükemmel olmasını beklemek', t0: 56.2, rows: [
    { k: 'bad', text: 'Hep başarılı, düzenli ve hatasız olsun', t0: 60.0 },
    { k: 'eff', text: 'Başarısızlığı tehdit olarak algılar', t0: 64.8 },
    { k: 'tip', text: 'Sonuca değil, çabaya ve gelişime bakın 🌱', t0: 70.0 },
    { k: 'good', text: '“En yüksek notu alman gerekmiyor, önemli olan ne öğrendiğin.”', t0: 77.4 } ] },
  { n: 10, title: 'Hata yapmasına *izin *vermemek', t0: 85.0, rows: [
    { k: 'bad', text: 'Her hatayı önlemek, her sorunu onun yerine çözmek', t0: 89.7 },
    { k: 'eff', text: 'Baş edebileceğine güveni zorlaşır', t0: 94.2 },
    { k: 'tip', text: 'Güvenli sınırlar içinde hata yapsın 🧩', t0: 98.7 },
    { k: 'good', text: '“Sence bunu başka nasıl deneyebilirsin?”', t0: 107.4 } ] },
  { n: 11, title: 'Sürekli *uyarmak', t0: 112.4, rows: [
    { k: 'bad', text: '“Dikkat et, düşeceksin!” “Öyle yapma, yanlış!”', t0: 117.8 },
    { k: 'eff', text: 'Çevresini tehlike alanı gibi algılar', t0: 120.6 },
    { k: 'tip', text: 'Gerektiğinde kısa ve somut uyarın', t0: 126.4 },
    { k: 'good', text: 'Güvenli durumlarda keşfetmesine izin verin', t0: 131.1 },
    { k: 'tip', text: 'Riskleri tanımayı öğretin 🛡️', t0: 134.2 } ] },
  { n: 12, title: '*“Ağlama.” demek', t0: 141.9, rows: [
    { k: 'eff', text: 'Duygusunu göstermenin yanlış olduğunu öğrenir', t0: 146.2 },
    { k: 'good', text: '“Üzüldün, ağlayabilirsin; ben buradayım.”', t0: 152.8 },
    { k: 'tip', text: 'Sakinleşince birlikte konuşun 💬', t0: 158.5 } ] },
];

// ---------- sahneler (üst panel) ----------
const SCENES = [
  { s: -0.4, e: 10.2, acc: C.lilac, acc2: C.sky, draw: sWelcome },
  ...ITEMS.map((d, i) => ({ s: d.t0 - 0.1, e: i < ITEMS.length - 1 ? ITEMS[i + 1].t0 - 0.1 : 161.2,
    acc: [C.coral, C.yellow, C.sky, C.lilac, C.coral, C.mint][i], acc2: [C.lilac, C.coral, C.mint, C.sky, C.yellow, C.sky][i], draw: t => item(t, d) })),
  { s: 161.2, e: 999, acc: C.yellow, acc2: C.coral, draw: sEnd },
];

// Açılışta üst panel görünmez (tam ekran); geçiş anında boş kalmasın diye 7–12 sırası
function sWelcome(t) {
  words('Part 2: 7–12', 540, 300, t, 8.7, { size: 60, weight: 900 });
  for (let i = 0; i < 12; i++) {
    const x = 540 + (i - 5.5) * 78, on = i >= 6;
    withT(x, 520, popS(t, 8.9 + i * 0.08, 0.4), 0, popA(t, 8.9 + i * 0.08), () => {
      circle(0, 0, 30, on ? C.yellow : 'rgba(255,255,255,0.15)'); text(String(i + 1), 0, 2, 28, on ? C.ink : C.muted, 900);
    });
  }
}

function sEnd(t) {
  words('12 maddenin tamamı', 540, 250, t, 161.3, { size: 54, weight: 900 });
  withT(540, 360, popS(t, 161.7, 0.5), 0, popA(t, 161.7), () => text('Part 1 + Part 2 profilde', 0, 0, 40, C.yellow, 800));
  for (let i = 0; i < 12; i++) {
    const x = 540 + (i - 5.5) * 78;
    withT(x, 480, popS(t, 161.5 + i * 0.06, 0.4), 0, popA(t, 161.5 + i * 0.06), () => {
      circle(0, 0, 30, C.yellow); text(String(i + 1), 0, 2, 28, C.ink, 900);
    });
  }
  const t0 = 162.3;
  withT(540, 680, popS(t, t0, 0.5), 0, popA(t, t0), () => {
    shadow(true, 36, 14); rrect(-420, -110, 840, 220, 44, C.white); shadow(false);
    profilePic(-300, 0, 70, t);
    text(USERNAME, 20, -40, 40, C.ink, 900);
    const press = t > 163.3 && t < 163.6 ? 1 : 0;
    followButton(20, 40, 300, 70, 32, prog(t, 163.5, 0.4), press, false);
  });
  if (t > t0 + 0.5) tapHand(640, 760, t, 163.3);
  withT(540, 860, popS(t, 163.9, 0.5), 0, popA(t, 163.9), () => text('Kaydet, ihtiyacı olana gönder 💛', 0, 0, 38, C.white, 800));
}

// ---------- açılış: tam ekran konuşmacı + başlık + isim levhası (yüzün altında) ----------
function introOverlay(t) {
  const a = eOut(prog(t, 0.2, 0.6)) * (1 - eInOut(prog(t, 9.8, 0.6)));
  if (a > 0) {
    withT(540, 1250 + 40 * (1 - eOut(prog(t, 0.2, 0.6))), 1, 0, a, () => {
      shadow(true, 36, 12, 'rgba(0,0,0,0.4)'); rrect(-490, -170, 980, 340, 50, 'rgba(12,16,40,0.86)'); shadow(false);
      withT(380, -160, popS(t, 0.8, 0.5), 0.12, 1, () => { rrect(-90, -34, 180, 68, 34, C.yellow); text('PART 2', 0, 3, 34, C.ink, 900); });
      text('ÇOCUKLARDA KAYGIYI', 0, -70, 66, C.white, 900);
      text('ARTIRAN', 0, 10, 66, C.white, 900);
      text('12 ŞEY · 7–12', 0, 105, 92, C.coral, 900);
    });
  }
  // isim levhası, başlık kartının altında
  const u = t - 2.5;
  if (u >= 0 && u <= 7) {
    const b = eOut(prog(u, 0, 0.5)) * (1 - eInOut(prog(u, 6.5, 0.5)));
    withT(60 - 80 * (1 - eOut(prog(u, 0, 0.6))), 1580, 1, 0, b, () => {
      font(28, 800);
      const w = Math.max(ctx.measureText('Çocuk Psikolojisi & Dikkat Üzerine').width, 420) + 80;
      shadow(true, 30, 10, 'rgba(0,0,0,0.35)'); rrect(0, -70, w, 140, 24, 'rgba(12,16,40,0.86)'); shadow(false);
      rrect(0, -70, 12, 140, 6, C.yellow);
      text('Pedagog', 38, -24, 30, C.yellow, 800, 'left');
      text('Necla SAYGIN', 178, -24, 46, C.white, 900, 'left');
      text('Çocuk Psikolojisi & Dikkat Üzerine', 38, 32, 28, 'rgba(255,255,255,0.8)', 800, 'left');
    });
  }
}

window.FULL = t => splitFull(t, introOverlay, () => {});
</script>
</body>
</html>
