<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Reels v14 — Çocuk odası, üçüncü öğretmen</title>
<style>
  @font-face { font-family: RD; font-weight: 600; src: url('file:///usr/share/fonts/opentype/inter/InterDisplay-SemiBold.otf'); }
  @font-face { font-family: RD; font-weight: 700; src: url('file:///usr/share/fonts/opentype/inter/InterDisplay-Bold.otf'); }
  @font-face { font-family: RD; font-weight: 800; src: url('file:///usr/share/fonts/opentype/inter/InterDisplay-ExtraBold.otf'); }
  @font-face { font-family: RD; font-weight: 900; src: url('file:///usr/share/fonts/opentype/inter/InterDisplay-Black.otf'); }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  canvas { display: block; }
  #f { position: absolute; left: 0; top: 0; visibility: hidden; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="960"></canvas>
<canvas id="o" width="1080" height="960"></canvas>
<canvas id="f" width="1080" height="1920"></canvas>
<script src="../engine.js"></script>
<script src="../follow.js"></script>
<script src="../splitfull.js"></script>
<script>
// Video 14: Çocuğunuz odasına girmiyor mu? Odanın 3 kuralı. Altyazı yok.
// Açılış ~10 sn tam ekran konuşmacı → bölünmüş ekran; altta stok görüntü ağırlıkta, konuşmacı iki kısa anda.
// HeyGen filigranı (sağ alt, x > 780, y > 1370) kadraj dışında; tam ekranda yazılar yüzün altında.
const DURATION = 99.54;
const SRC = { w: 1022, h: 1532 };
const BAND = { x: 116, y: 116, w: 792, h: 704 };
const FULLV = { x: 129, y: 0, w: 766, h: 1362 };
const AVATAR = { chain: `crop=${BAND.w}:${BAND.h}:${BAND.x}:${BAND.y},scale=1620:1440:flags=lanczos`, focusY: 0.35 };
const INTRO = { hold: 8.8, len: 1.2 };
const OUTRO = { at: 1e9, len: 1 };
const FULL_RANGES = [[0, INTRO.hold + INTRO.len]];
const TOP_CLIPS = [{ name: 'avIn', src: 'avatar_src.mp4', from: 0, start: 0, end: INTRO.hold + INTRO.len + 0.2 }];
const CHUNKS = [];

// Alt bölüm: 'A' = konuşmacı; diğerleri [kaynak, başlangıç, bitiş, kaynaktaki başlangıç, dikey odak]
const S12 = '../v12/clips/stok.mp4', S10 = '../v10/clips/stok.mp4', S8 = '../v8/clips/stok.mp4';
const KURE = '../v4/clips/kure.mp4', BLOK = '../v4/clips/bloklar.mp4';
const BOTTOM_PLAN = [
  ['A', 0, INTRO.hold + INTRO.len],
  [KURE, 10.0, 13.2, 2.0, 0.3],                    // Reggio Emilia, üçüncü öğretmen
  [S12, 13.2, 15.4, 8.5, 0.35],                    // mekan sessiz eğitmen
  [S12, 15.4, 19.9, 69.0, 0.4],                    // davet eder, sakinleştirir
  [S10, 19.9, 23.6, 97.0, 0.3],                    // ne söylediği sizin elinizde
  ['A', 23.6, 26.9],                               // üç kural
  [S12, 26.9, 29.5, 55.0, 0.4],                    // boyut değil yükseklik
  [S12, 29.5, 33.5, 74.0, 0.4],                    // raf göğüs hizası
  [BLOK, 33.5, 37.5, 2.0, 0.08],                   // göz seviyesi
  [S8, 37.5, 41.5, 19.0, 0.3],                     // yardımsız görür
  [S12, 41.5, 46.9, 60.0, 0.4],                    // üç bölge
  [S12, 46.9, 51.0, 79.0, 0.4],                    // küçük bölmeler
  [KURE, 51.0, 56.5, 9.0, 0.3],                    // sakin, odaklı, uzun oyun
  [S12, 56.5, 61.0, 0.5, 0.35],                    // çocuk boyunda masa
  [S8, 61.0, 64.5, 59.0, 0.2],                     // onun krallığı
  [S12, 64.5, 68.9, 20.5, 0.3],                    // bağımsızlık
  [S8, 68.9, 72.2, 0.5, 0.25],                     // sabah uyanıyorsunuz
  [BLOK, 72.2, 77.6, 9.0, 0.08],                   // kendi kendine oynuyor
  [S8, 77.6, 80.2, 23.0, 0.3],                     // keşif alanı
  [S10, 80.2, 82.4, 78.0, 0.35],                   // aidiyet
  ['A', 82.4, 84.6],                               // bugün tek bir şey
  [S10, 84.6, 89.5, 106.0, 0.4],                   // gerisini o halleder
  [S8, 89.5, 94.2, 27.0, 0.15],                    // oyun hayati
  [S10, 94.2, DURATION, 88.5, 0.35],               // yorumlara yazın
];
const BOTTOM_CLIPS = BOTTOM_PLAN.map((p, i) => {
  if (p[0] === 'A') return null;
  const prev = BOTTOM_PLAN[i - 1], next = BOTTOM_PLAN[i + 1];
  return { src: p[0], start: p[1], end: p[2], from: p[3], focusY: p[4],
    fadeIn: prev[0] === 'A', fadeOut: !!next && next[0] === 'A' };
}).filter(Boolean);

window.preload = () => preloadFollow('../');

function noRow(label, em, y, t, t0, tS, size = 42) {
  withT(540, y, popS(t, t0, 0.5), 0, popA(t, t0) * (1 - 0.45 * prog(t, tS + 0.1, 0.4)), () => pill(label, em, size, 'rgba(255,255,255,0.9)', C.ink));
  if (t >= tS) { font(size, 800); const w = ctx.measureText(label).width + size * 1.25 + 70; strike(540 - w / 2 - 20, 540 + w / 2 + 20, y, t, tS); }
}
function card(x, y, w, h, bg, t, t0, body, rot = 0) {
  withT(x, y, popS(t, t0, 0.55), rot, popA(t, t0), () => { shadow(true, 36, 14); rrect(-w / 2, -h / 2, w, h, 44, bg); shadow(false); body(); });
}


// ---------- sahneler (üst panel) ----------
const SCENES = [
  { s: -0.4, e: 23.6, acc: C.mint, acc2: C.sky, draw: sThird },
  { s: 23.6, e: 26.2, acc: C.yellow, acc2: C.coral, draw: sRules },
  { s: 26.2, e: 41.5, acc: C.sky, acc2: C.mint, draw: sHeight },
  { s: 41.5, e: 56.5, acc: C.lilac, acc2: C.yellow, draw: sZones },
  { s: 56.5, e: 68.9, acc: C.coral, acc2: C.yellow, draw: sMagnet },
  { s: 68.9, e: 77.5, acc: C.yellow, acc2: C.lilac, draw: sImagine },
  { s: 77.5, e: 82.4, acc: C.mint, acc2: C.coral, draw: sSwap },
  { s: 82.4, e: 89.5, acc: C.sky, acc2: C.yellow, draw: sToday },
  { s: 89.5, e: 95.6, acc: C.mint, acc2: C.sky, draw: sVital },
  { s: 95.6, e: 999, acc: C.lilac, acc2: C.coral, draw: sComment },
];

function row(label, em, y, t, t0, bg = 'rgba(255,255,255,0.92)', fg = C.ink, size = 40) {
  withT(540, y, popS(t, t0, 0.5), 0, popA(t, t0), () => pill(label, em, size, bg, fg));
}
function numTitle(n, label, t, t0) {
  withT(540, 245, popS(t, t0, 0.5), 0, popA(t, t0), () => { rrect(-60, -30, 120, 60, 30, C.coral); text(`${n} / 3`, 0, 2, 32, C.white, 900); });
  para(label, 540, 330, 960, t, t0 + 0.1, { size: 50, weight: 900, per: 0.1 });
}

function sThird(t) {
  row('Reggio Emilia Pedagojisi', '🇮🇹', 255, t, 9.9, C.white, C.ink, 38);
  withT(540, 400, popS(t, 11.9, 0.6), 0, popA(t, 11.9), () => { shadow(true, 40, 0, 'rgba(52,211,153,0.6)'); text('“Üçüncü öğretmen”', 0, 0, 86, C.mint, 900); shadow(false); });
  para('Mekan, çocuğun *sessiz eğitmenidir', 540, 520, 940, t, 13.3, { size: 44, weight: 900, per: 0.12, accent: C.yellow });
  [['Davet eder', '👋', 17.3, 220, C.yellow], ['Yönlendirir', '🧭', 18.0, 540, C.sky], ['Sakinleştirir', '🌿', 18.9, 860, C.mint]].forEach(([l, em, t0, x, col]) =>
    withT(x, 670, popS(t, t0, 0.5), 0, popA(t, t0), () => pill(l, em, 34, col, C.ink)));
  withT(540, 820, popS(t, 21.8, 0.5), 0, popA(t, 21.8), () => pill('Ne söylediği sizin elinizde', '✋', 40, C.coral, C.white));
}

function sRules(t) {
  para('Kimsenin söylemediği *3 *kural', 540, 360, 940, t, 23.7, { size: 60, weight: 900, per: 0.12, accent: C.yellow });
  for (let i = 0; i < 3; i++) withT(540 + (i - 1) * 140, 560, popS(t, 25.0 + i * 0.15, 0.4), 0, popA(t, 25.0 + i * 0.15), () => {
    circle(0, 0, 50, C.yellow); text(String(i + 1), 0, 2, 50, C.ink, 900);
  });
}

// 1) Raf yüksekliği: çocuk silueti + raf, göz ve göğüs hizası çizgileri
function sHeight(t) {
  numTitle(1, 'Boyut değil, *yükseklik meselesi', t, 26.3);
  const a = popA(t, 29.4, 0.5);
  withT(0, 0, 1, 0, a, () => {
    // zemin
    rrect(80, 860, 920, 8, 4, 'rgba(255,255,255,0.25)');
    // çocuk
    emoji('🧍', 270, 650, 420);
    // raf (sağda): 2 katlı alçak raf
    const sx = 560, sw = 400;
    rrect(sx, 600, sw, 260, 18, '#C98A54');
    rrect(sx + 14, 616, sw - 28, 110, 10, '#7A4A28'); rrect(sx + 14, 738, sw - 28, 110, 10, '#7A4A28');
    [['🧸', 640, 671], ['🚂', 760, 671], ['🎨', 880, 671], ['📚', 640, 793], ['🧩', 760, 793], ['🪀', 880, 793]].forEach(([e, x, y], i) =>
      withT(x, y, popS(t, 30.0 + i * 0.12, 0.4), 0, 1, () => emoji(e, 0, 0, 60)));
  });
  // göğüs hizası çizgisi (raf üst yüzeyi)
  const l1 = eOut(prog(t, 31.0, 0.6));
  if (l1 > 0) {
    ctx.save(); ctx.setLineDash([16, 12]); ctx.strokeStyle = C.yellow; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(340, 600); ctx.lineTo(340 + 650 * l1, 600); ctx.stroke(); ctx.restore();
    withT(770, 555, 1, 0, popA(t, 31.4), () => pill('Raf üstü = göğüs hizası', '📐', 30, C.yellow, C.ink));
  }
  const l2 = eOut(prog(t, 33.8, 0.6));
  if (l2 > 0) {
    ctx.save(); ctx.setLineDash([16, 12]); ctx.strokeStyle = C.mint; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(320, 500); ctx.lineTo(320 + 670 * l2, 500); ctx.stroke(); ctx.restore();
    withT(770, 455, 1, 0, popA(t, 34.2), () => pill('En üst raf ≤ göz seviyesi', '👀', 30, C.mint, C.ink));
  }
  withT(540, 920, popS(t, 38.0, 0.5), 0, popA(t, 38.0), () => text('✅ Her oyuncağı yardımsız görür', 0, 0, 36, C.white, 900));
}

// 2) Üç bölge: kat planı
function sZones(t) {
  numTitle(2, 'Tek parça değil, *üç *bölge', t, 41.6);
  const z = [['Oyun', '🧸', 45.0, C.yellow], ['Uyku', '🛏️', 45.6, C.lilac], ['Depolama', '🗄️', 46.1, C.sky]];
  const fade = 1 - 0.55 * prog(t, 51.5, 0.5);
  z.forEach(([l, em, t0, col], i) => {
    const x = 220 + i * 320;
    withT(x, 530, popS(t, t0, 0.5), 0, popA(t, t0) * fade, () => {
      shadow(true, 26, 10); rrect(-145, -120, 290, 240, 30, col); shadow(false);
      emoji(em, 0, -30, 90); text(l, 0, 70, 38, C.ink, 900);
    });
  });
  withT(540, 700, popS(t, 49.0, 0.5), 0, popA(t, 49.0) * fade, () => text('Küçük bölmeler → çocuklar daha…', 0, 0, 34, C.muted, 800));
  [['Sakin', '😌', 51.8, 230, C.mint], ['Odaklı', '🎯', 52.6, 540, C.yellow], ['Uzun oyun', '⏳', 53.6, 850, C.sky]].forEach(([l, em, t0, x, col]) =>
    withT(x, 820, popS(t, t0, 0.5), 0, popA(t, t0), () => pill(l, em, 38, col, C.ink)));
}

// 3) En güçlü mıknatıs: çocuk boyunda masa ve sandalye
function sMagnet(t) {
  numTitle(3, 'En güçlü *mıknatıs 🧲', t, 56.6);
  card(540, 500, 900, 160, C.white, t, 58.6, () => { emoji('🪑', -360, 0, 80); text('Çocuk boyunda', 50, -24, 44, C.ink, 900); text('masa + sandalye', 50, 30, 44, C.coral, 900); });
  withT(540, 655, popS(t, 61.2, 0.5), 0, popA(t, 61.2), () => pill('Kendi bardağını koyabiliyorsa → onun krallığı', '👑', 32, C.yellow, C.ink));
  withT(540, 830, popS(t, 64.6, 0.55), 0, popA(t, 64.6), () => {
    shadow(true, 26, 10); rrect(-470, -80, 940, 160, 34, 'rgba(255,255,255,0.12)'); shadow(false);
    rrect(-470, -80, 10, 160, 5, C.mint);
    text('“Bağımsızlık hazırlanmış bir', 0, -22, 38, C.white, 900);
    text('çevrede başlar.” — Montessori', 0, 30, 38, C.mint, 900);
  });
}

function sImagine(t) {
  words('Şimdi hayal edin ✨', 540, 260, t, 69.0, { size: 58, weight: 900 });
  row('Sabah uyanıyorsunuz', '☀️', 420, t, 70.8, C.yellow);
  row('Çocuğunuz sizi çağırmıyor', '🤫', 560, t, 72.3, C.white);
  row('Odasında kendi dünyasını kurmuş', '🌍', 700, t, 74.2, C.mint);
}

function sSwap(t) {
  noRow('Oyuncak kutusu', '📦', 330, t, 77.6, 78.6, 42);
  row('Keşif alanı', '🔭', 450, t, 79.1, C.sky, C.ink, 46);
  noRow('Depo', '🗄️', 620, t, 80.2, 80.7, 42);
  row('Aidiyet hissi', '💛', 740, t, 81.3, C.yellow, C.ink, 46);
}

function sToday(t) {
  words('Bugün tek bir şey yapın ☝️', 540, 250, t, 82.6, { size: 54, weight: 900 });
  // göz hizası çizgisi
  const l = eOut(prog(t, 84.0, 0.6));
  if (l > 0) {
    ctx.save(); ctx.setLineDash([18, 12]); ctx.strokeStyle = C.mint; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(540 - 420 * l, 520); ctx.lineTo(540 + 420 * l, 520); ctx.stroke(); ctx.restore();
    withT(540, 590, 1, 0, popA(t, 84.4), () => text('👀 göz hizası', 0, 0, 34, C.mint, 900));
  }
  ['🧸', '🚂', '🎨'].forEach((e, i) => {
    const t0 = 85.4 + i * 0.35, p = eBack(prog(t, t0, 0.6));
    if (t >= t0) withT(340 + i * 200, 820 - 340 * p, 1, 0, 1, () => emoji(e, 0, 0, 110));
  });
  withT(540, 880, popS(t, 88.1, 0.5), 0, popA(t, 88.1), () => pill('Gerisini o halleder', '😊', 40, C.yellow, C.ink));
}

function sVital(t) {
  words('Oyun çocuk için…', 540, 270, t, 90.4, { size: 58, weight: 900 });
  [['Ekmek', '🍞', 91.6, 230, C.yellow], ['Su', '💧', 92.6, 540, C.sky], ['Hava', '🌬️', 92.9, 850, C.mint]].forEach(([l, em, t0, x, col]) =>
    withT(x, 500, popS(t, t0, 0.5), 0, popA(t, t0), () => {
      shadow(true, 26, 10); rrect(-130, -110, 260, 220, 36, col); shadow(false);
      emoji(em, 0, -25, 90); text(l, 0, 65, 38, C.ink, 900);
    }));
  withT(540, 720, popS(t, 93.3, 0.55), 0, popA(t, 93.3), () => { shadow(true, 40, 0, 'rgba(255,94,108,0.6)'); text('kadar hayati!', 0, 0, 80, C.coral, 900); shadow(false); });
  withT(540, 860, popS(t, 94.3, 0.5), 0, popA(t, 94.3), () => text('Odası bunu hatırlatsın 🏠', 0, 0, 38, C.white, 800));
}

function sComment(t) {
  words('Deneyenler yorumlara yazsın 💬', 540, 260, t, 95.7, { size: 50, weight: 900 });
  withT(540, 520, popS(t, 96.6, 0.55), 0, popA(t, 96.6), () => {
    shadow(true, 36, 14); rrect(-440, -120, 880, 240, 40, C.white); shadow(false);
    circle(-350, -40, 44, C.lilac); emoji('👩', -350, -40, 54);
    text('anne_ve_ben', -290, -60, 30, C.ink, 900, 'left');
    const msg = 'Oyuncakları göz hizasına koyduk, 40 dk odasından çıkmadı! 😍';
    const n = Math.floor(clamp((t - 97.0) / 1.6) * msg.length);
    para(msg.slice(0, n) || ' ', 60, 30, 680, 1e9, 0, { size: 32, weight: 800, color: C.ink, per: 0, lineH: 40 });
  });
  withT(540, 780, popS(t, 97.4, 0.55), 0, popA(t, 97.4), () => pill('Odasında kaç dakika kaldı?', '⏱️', 44, C.yellow, C.ink));
}

// ---------- açılış (tam ekran, yazılar yüzün altında) ----------
function nameTag(t, t0, dur) {
  const u = t - t0;
  if (u < 0 || u > dur) return;
  const c = eOut(prog(u, 0, 0.5)) * (1 - eInOut(prog(u, dur - 0.5, 0.5)));
  withT(60 - 80 * (1 - eOut(prog(u, 0, 0.6))), 1640, 1, 0, c, () => {
    font(28, 800);
    const w = Math.max(ctx.measureText('Çocuk Psikolojisi & Dikkat Üzerine').width, 420) + 80;
    shadow(true, 30, 10, 'rgba(0,0,0,0.35)'); rrect(0, -70, w, 140, 24, 'rgba(12,16,40,0.86)'); shadow(false);
    rrect(0, -70, 12, 140, 6, C.yellow);
    text('Pedagog', 38, -24, 30, C.yellow, 800, 'left');
    text('Necla SAYGIN', 178, -24, 46, C.white, 900, 'left');
    text('Çocuk Psikolojisi & Dikkat Üzerine', 38, 32, 28, 'rgba(255,255,255,0.8)', 800, 'left');
  });
}

function introOverlay(t) {
  const a = eOut(prog(t, 0.2, 0.5)) * (1 - eInOut(prog(t, 8.3, 0.5)));
  if (a > 0) withT(540, 1220 + 30 * (1 - eOut(prog(t, 0.2, 0.5))), 1, 0, a, () => {
    shadow(true, 36, 12, 'rgba(0,0,0,0.4)'); rrect(-480, -150, 960, 300, 50, 'rgba(12,16,40,0.88)'); shadow(false);
    text('Çocuğunuz odasına', 0, -75, 60, C.white, 900);
    text('girmiyor mu? 🚪', 0, 0, 60, C.white, 900);
    withT(0, 85, popS(t, 2.4, 0.5), 0, popA(t, 2.4), () => text('Sorun çocukta değil, ODADA!', 0, 0, 52, C.yellow, 900));
  });
  const b = popA(t, 5.6) * (1 - eInOut(prog(t, 8.3, 0.5)));
  if (b > 0) withT(540, 1440, popS(t, 5.6, 0.5), 0, b, () => pill('Saklama kutusu gibi oda → terk edilir', '📦', 34, C.white, C.ink));
  nameTag(t, 1.0, 4.4);
}

window.FULL = t => splitFull(t, introOverlay, () => {});
</script>
</body>
</html>
